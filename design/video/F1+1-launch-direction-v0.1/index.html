<!doctype html>
<html lang="zh-CN" data-mode="shot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1+1 Launch Film · Direction v0.1</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080a0d;
    --surface: #0d1014;
    --ink: #f4f5f7;
    --muted: #8f969f;
    --line: #2d333b;
    --signal: #c56f55;
    --focus: #77a7ff;
    --ease-enter: cubic-bezier(.16, 1, .3, 1);
    --ease-exit: cubic-bezier(.7, 0, .84, 0);
    --ease-linear-out: cubic-bezier(0, 0, .2, 1);
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020305; }
  body {
    position: relative;
    display: block;
    color: var(--ink);
    font-family: Inter, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  button, a { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  .stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    isolation: isolate;
    background: var(--bg);
    transform: scale(var(--stage-scale, 1));
    transform-origin: top left;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .28;
    background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 100% 54px;
    mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 -120px 180px rgba(0,0,0,.25);
  }

  .safe-label {
    position: absolute;
    top: 58px;
    left: 72px;
    z-index: 12;
    color: var(--muted);
    font: 600 17px/1.2 "SF Mono", Menlo, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .brand-lock {
    position: absolute;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .signal-dot {
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--signal);
  }

  .wordmark {
    margin: 0;
    color: var(--ink);
    font: 800 148px/.86 "Arial Narrow", "Avenir Next Condensed", Impact, sans-serif;
    letter-spacing: -.055em;
  }

  .tagline {
    margin: 0;
    color: var(--ink);
    font: 720 80px/1.08 "Arial Narrow", "Avenir Next Condensed", "PingFang SC", sans-serif;
    letter-spacing: -.035em;
  }

  .meta {
    color: var(--muted);
    font: 600 18px/1.5 "SF Mono", Menlo, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .hairline {
    position: absolute;
    z-index: 3;
    background: var(--line);
  }

  .screen-shell {
    position: absolute;
    z-index: 5;
    display: none;
    margin: 0;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    background: var(--surface);
    box-shadow: 0 34px 100px rgba(0,0,0,.42);
  }

  .screen-shell img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .feature-list {
    position: absolute;
    z-index: 8;
    display: none;
    gap: 40px;
  }

  .feature {
    display: grid;
    grid-template-columns: 58px 1fr;
    align-items: baseline;
    gap: 18px;
  }

  .feature b {
    color: var(--signal);
    font: 600 18px/1 "SF Mono", Menlo, monospace;
  }

  .feature span {
    color: var(--ink);
    font: 700 34px/1.15 "Arial Narrow", "Avenir Next Condensed", "PingFang SC", sans-serif;
  }

  .tagline, .meta { display: none; }

  .controls {
    position: fixed;
    z-index: 99;
    left: 50%;
    bottom: 18px;
    display: flex;
    gap: 8px;
    padding: 8px;
    transform: translateX(-50%);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(8,10,13,.88);
    backdrop-filter: blur(14px);
  }

  .controls a, .controls button {
    min-height: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: 8px;
    color: #c5c9ce;
    background: transparent;
    text-decoration: none;
    cursor: pointer;
  }

  .controls a:hover, .controls button:hover, .controls [aria-current="page"] {
    color: #fff;
    background: rgba(255,255,255,.08);
  }

  html[data-capture="true"] .controls { display: none; }

  /* Styleframe 01 · brand opening */
  html[data-mode="style1"] .brand-lock {
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
  }
  html[data-mode="style1"] .tagline,
  html[data-mode="style1"] .meta { display: block; }
  html[data-mode="style1"] .tagline {
    position: absolute;
    left: 50%;
    top: 59%;
    width: 100%;
    text-align: center;
    transform: translateX(-50%);
  }
  html[data-mode="style1"] .meta {
    position: absolute;
    left: 50%;
    top: 72%;
    transform: translateX(-50%);
  }
  html[data-mode="style1"] .hairline {
    left: 50%;
    top: 23%;
    width: 1px;
    height: 11%;
  }

  /* Styleframe 02 · real product hero */
  html[data-mode="style2"] .screen-shell {
    display: block;
    left: 72px;
    top: 124px;
    width: 1360px;
    height: 850px;
  }
  html[data-mode="style2"] .feature-list {
    display: grid;
    right: 78px;
    top: 310px;
    width: 330px;
  }
  html[data-mode="style2"] .hairline {
    right: 443px;
    top: 124px;
    width: 1px;
    height: 850px;
  }
  html[data-mode="style2"] .brand-lock {
    right: 78px;
    bottom: 72px;
    gap: 10px;
  }
  html[data-mode="style2"] .brand-lock .signal-dot { width: 10px; height: 10px; }
  html[data-mode="style2"] .brand-lock .wordmark { font-size: 34px; }

  /* Styleframe 03 · close */
  html[data-mode="style3"] .hairline {
    left: 50%;
    top: 16%;
    width: 1px;
    height: 12%;
  }
  html[data-mode="style3"] .tagline,
  html[data-mode="style3"] .meta { display: block; }
  html[data-mode="style3"] .tagline {
    position: absolute;
    left: 50%;
    top: 38%;
    width: 1400px;
    text-align: center;
    transform: translateX(-50%);
    font-size: 96px;
  }
  html[data-mode="style3"] .brand-lock {
    left: 50%;
    top: 61%;
    transform: translateX(-50%);
    gap: 12px;
  }
  html[data-mode="style3"] .brand-lock .signal-dot { width: 12px; height: 12px; }
  html[data-mode="style3"] .brand-lock .wordmark { font-size: 52px; }
  html[data-mode="style3"] .meta {
    position: absolute;
    left: 50%;
    top: 72%;
    transform: translateX(-50%);
  }

  /* Single-shot verification · 4.8s deterministic reveal */
  html[data-mode="shot"] .safe-label { animation: labelIn .6s var(--ease-enter) .2s both; }
  html[data-mode="shot"] .tagline,
  html[data-mode="shot"] .screen-shell { display: block; }
  html[data-mode="shot"] .brand-lock {
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    animation: brandRoute 4.8s var(--ease-enter) both;
  }
  html[data-mode="shot"] .tagline {
    position: absolute;
    left: 50%;
    top: 60%;
    width: 100%;
    text-align: center;
    transform: translateX(-50%);
    animation: taglineRoute 4.8s var(--ease-enter) both;
  }
  html[data-mode="shot"] .hairline {
    left: 300px;
    top: 150px;
    width: 1px;
    height: 760px;
    transform-origin: top;
    animation: railIn 4.8s var(--ease-enter) both;
  }
  html[data-mode="shot"] .screen-shell {
    left: 360px;
    top: 132px;
    width: 1450px;
    height: 906px;
    transform-origin: 50% 50%;
    animation: productIn 4.8s var(--ease-enter) both;
  }

  @keyframes labelIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes brandRoute {
    0%, 25% { left: 50%; top: 46%; transform: translate(-50%,-50%) scale(1); opacity: 1; }
    34%, 100% { left: 72px; top: 70px; transform: translate(0,0) scale(.24); opacity: .84; }
  }
  @keyframes taglineRoute {
    0%, 24% { opacity: 1; transform: translateX(-50%) translateY(0); }
    30%, 100% { opacity: 0; transform: translateX(-50%) translateY(-16px); }
  }
  @keyframes railIn {
    0%, 27% { opacity: 0; transform: scaleY(0); }
    46%, 100% { opacity: 1; transform: scaleY(1); }
  }
  @keyframes productIn {
    0%, 30% { opacity: 0; transform: translateY(70px) scale(.94); filter: blur(6px); }
    48%, 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion="full"]) *,
    html:not([data-motion="full"]) *::before,
    html:not([data-motion="full"]) *::after {
      animation-duration: .001ms !important;
      animation-delay: 0ms !important;
    }
  }
</style>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var mode = q.get('mode') || 'shot';
    if (!/^(shot|style1|style2|style3)$/.test(mode)) mode = 'shot';
    document.documentElement.dataset.mode = mode;
    document.documentElement.dataset.capture = q.get('capture') === '1' ? 'true' : 'false';
    document.documentElement.dataset.motion = q.get('motion') === 'full' ? 'full' : 'system';
    function fitStage() {
      var stage = document.querySelector('.stage');
      if (!stage) return;
      var scale = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.setProperty('--stage-scale', String(scale));
      stage.style.left = ((innerWidth - 1920 * scale) / 2) + 'px';
      stage.style.top = ((innerHeight - 1080 * scale) / 2) + 'px';
    }
    addEventListener('DOMContentLoaded', fitStage);
    addEventListener('resize', fitStage);
  }());
</script>
</head>
<body>
  <main class="stage" aria-label="F1+1 发布视频方向预览">
    <div class="safe-label">F1+1 · launch film · direction 01</div>
    <div class="hairline" aria-hidden="true"></div>

    <div class="brand-lock">
      <i class="signal-dot" aria-hidden="true"></i>
      <h1 class="wordmark">F1+1</h1>
    </div>

    <p class="tagline">信息 + 时间 + 时间线</p>
    <p class="meta">27s · 16:9 · 30fps · no voiceover</p>

    <figure class="screen-shell">
      <img src="assets/frozen-final-dark-1440.png" alt="F1+1 v0.2 冻结设计深色 1440 真实截图">
    </figure>

    <div class="feature-list" aria-label="已确认功能">
      <div class="feature"><b>01</b><span>时间线浏览</span></div>
      <div class="feature"><b>02</b><span>就地展开</span></div>
      <div class="feature"><b>03</b><span>多图证据</span></div>
    </div>
  </main>

  <nav class="controls" aria-label="方向预览切换">
    <a href="?mode=style1">开场帧</a>
    <a href="?mode=style2">产品帧</a>
    <a href="?mode=style3">收束帧</a>
    <a href="?mode=shot">动态镜头</a>
    <button type="button" id="replay">重播</button>
  </nav>

<script>
  (function () {
    var mode = document.documentElement.dataset.mode;
    document.querySelectorAll('.controls a').forEach(function (a) {
      if (a.getAttribute('href') === '?mode=' + mode) a.setAttribute('aria-current', 'page');
    });
    document.getElementById('replay').addEventListener('click', function () {
      if (mode !== 'shot') { location.search = '?mode=shot'; return; }
      var stage = document.querySelector('.stage');
      stage.style.display = 'none';
      void stage.offsetHeight;
      stage.style.display = '';
    });
  }());
</script>
</body>
</html>
